# Источники мониторинга сообщений о паводках (floodvalue.media, #168). Лежит в пакете, не в
# configs/: configs/ заморожен к eval-test, а этот файл на p, маску и порог не влияет.
# Источник включается, только если enabled: true И terms_status: checked (условия проверены
# по официальному документу, ссылка — terms_url, дата — terms_checked). Ключей здесь нет:
# секреты — только в переменных окружения сервера (.env.example).
# kind: news — публикации СМИ; bulletin — специализированные сводки (не журналистика).
sources:
  - source_id: cems_floods
    name: "Copernicus EMS — активации спутникового картирования паводков"
    kind: bulletin
    adapter: cems
    url: https://rapidmapping.emergency.copernicus.eu/
    enabled: true
    terms_status: checked
    terms_url: https://emergency.copernicus.eu/mapping/ems/terms-and-conditions-use-products
    terms_checked: "2026-09-26"
    # Политика данных Copernicus — Регламент (ЕС) № 1159/2013: «free, full and open access»
    # к данным и информации сервисов Copernicus, с указанием источника. Атрибуция EMS:
    # «© European Union, Copernicus Emergency Management Service». Храним название активации,
    # страны, время и центроид — метаданные публичного списка активаций.
    attribution: "© European Union, Copernicus Emergency Management Service"
    content_storage_policy: summary
    poll_interval_s: 1800
    config:
      endpoint: https://rapidmapping.emergency.copernicus.eu/backend/dashboard-api/public-activations-info/
      allowed_hosts: [rapidmapping.emergency.copernicus.eu]
      min_interval_s: 2
      lookback_days: 90
      page_size: 100
      max_pages: 3

  - source_id: gdacs_floods
    name: "GDACS — сводки о наводнениях"
    kind: bulletin
    adapter: gdacs
    url: https://www.gdacs.org/
    enabled: true
    terms_status: checked
    terms_url: https://www.gdacs.org/About/termofuse.aspx
    terms_checked: "2026-09-26"
    # Условия: данные «as is», только ориентировочные, не заменяют официальные оповещения,
    # для решений нужна проверка по другим источникам. Явного требования атрибуции нет —
    # указываем источник всё равно.
    attribution: "GDACS (Global Disaster Alert and Coordination System), gdacs.org"
    content_storage_policy: summary
    poll_interval_s: 900
    config:
      endpoint: https://www.gdacs.org/gdacsapi/api/events/geteventlist/SEARCH
      allowed_hosts: [www.gdacs.org]
      min_interval_s: 2
      lookback_days: 30

  - source_id: gdelt_floods
    name: "GDELT DOC 2.0 — новостные публикации о паводках"
    kind: news
    adapter: gdelt_doc
    url: https://www.gdeltproject.org/
    enabled: true
    terms_status: checked
    terms_url: https://www.gdeltproject.org/about.html#termsofuse
    terms_checked: "2026-09-26"
    # Метаданные GDELT открыты с обязательной ссылкой на GDELT Project. Тексты статей
    # принадлежат изданиям — храним только заголовок, URL, домен, язык и время (headline_only).
    # Лимит API: не чаще одного запроса в 5 секунд (ответ 429 сообщает об этом).
    attribution: "Метаданные: The GDELT Project, https://www.gdeltproject.org/"
    content_storage_policy: headline_only
    poll_interval_s: 900
    config:
      endpoint: https://api.gdeltproject.org/api/v2/doc/doc
      allowed_hosts: [api.gdeltproject.org]
      min_interval_s: 6
      query: '(flood OR flooding OR "flash flood" OR наводнение OR паводок OR подтопление)'
      maxrecords: 100
      initial_hours: 24
      overlap_minutes: 30

  - source_id: mchs_news
    name: "МЧС России — новости"
    kind: news
    adapter: rss
    url: https://mchs.gov.ru/
    enabled: true
    terms_status: checked
    terms_url: https://creativecommons.org/licenses/by/4.0/deed.ru
    terms_checked: "2026-09-26"
    # Подвал mchs.gov.ru: «Все материалы сайта доступны по лицензии: Creative Commons
    # «Attribution» 4.0 Всемирная» — выдержки можно хранить и показывать с указанием авторства.
    # Лента общая (пожары, ДТП, учения): о паводках — малая доля, остальное отсекает фильтр.
    attribution: "МЧС России, mchs.gov.ru — CC BY 4.0"
    content_storage_policy: summary
    poll_interval_s: 900
    config:
      endpoint: https://mchs.gov.ru/deyatelnost/press-centr/novosti/rss
      allowed_hosts: [mchs.gov.ru]
      min_interval_s: 2
      language: ru
      content_storage_policy: summary

  - source_id: example_rss
    name: "RSS-лента издания (пример, выключено)"
    kind: news
    adapter: rss
    url: null
    enabled: false
    terms_status: requires_check
    attribution: null
    content_storage_policy: headline_only
    poll_interval_s: 900
    config:
      endpoint: https://example.org/rss.xml
      allowed_hosts: [example.org]
      language: ru
