# Media monitoring sources (docs/features/media-monitoring.md §Д). Read only by
# floodvalue.media; never by the model, calibration, assets, procurement or export.
# A source whose terms are not confirmed by an official page stays enabled: false.
monitoring:
  enabled: true
  interval_s: 900            # starting assumption, not a promise of detection latency
  max_items_per_source: 40   # publications processed per source per cycle
  requests_budget: 30        # outbound HTTP calls per cycle, geocoding included
  geocode_budget: 10         # Nominatim calls per cycle (policy: ≤ 1/s, cache)
  llm_budget: 0              # no language model is configured (extraction: rules-v1)

sources:
  - source_id: gdacs
    name: GDACS — оповещения о паводках
    kind: bulletin
    adapter: gdacs
    url: https://www.gdacs.org/gdacsapi/api/events/geteventlist/SEARCH
    language: en
    region_scope: мир
    poll_interval_s: 900
    enabled: true
    terms_status: checked
    terms_note: >-
      gdacs.org/About/termofuse.aspx, проверено 2026-09-26: данные «as is», не для решений
      без подтверждения, не заменяют официальные оповещения. Ключ не нужен.
    attribution: GDACS (Global Disaster Alert and Coordination System), gdacs.org
    content_storage_policy: link_title_excerpt
    allowed_hosts: [www.gdacs.org]

  - source_id: gdelt
    name: GDELT DOC 2.0 — новости
    kind: api
    adapter: gdelt
    url: https://api.gdeltproject.org/api/v2/doc/doc
    language: multi
    region_scope: мир
    poll_interval_s: 900
    min_interval_s: 6        # the API answers 429 «limit requests to one every 5 seconds»
    enabled: true
    terms_status: checked
    terms_note: >-
      gdeltproject.org/about.html, проверено 2026-09-26: неограниченное использование при
      цитировании GDELT Project и ссылке на gdeltproject.org. Доступны только метаданные:
      заголовок, URL, домен, язык, время.
    attribution: GDELT Project, gdeltproject.org
    content_storage_policy: link_title
    query: >-
      (flood OR flooding OR "flash flood" OR inundated OR паводок OR подтопление OR
      наводнение OR подтоплены)
    allowed_hosts: [api.gdeltproject.org]

  - source_id: bbc-world
    name: BBC News — World
    kind: rss
    adapter: rss
    url: https://feeds.bbci.co.uk/news/world/rss.xml
    language: en
    region_scope: мир
    poll_interval_s: 900
    enabled: true
    terms_status: checked
    terms_note: >-
      bbc.co.uk/news/10628494, проверено 2026-09-26: «We encourage the use of BBC News feeds
      as part of a website», подпись «BBC News», без логотипов BBC.
    attribution: BBC News
    content_storage_policy: link_title_excerpt
    allowed_hosts: [feeds.bbci.co.uk]

  - source_id: tass
    name: ТАСС — лента
    kind: rss
    adapter: rss
    url: https://tass.ru/rss/v2.xml
    language: ru
    region_scope: Россия
    poll_interval_s: 900
    enabled: false
    terms_status: unchecked
    terms_note: >-
      Условия использования RSS не подтверждены: tass.ru/rss отвечает 403 (2026-09-26).
      Включать только после проверки условий на официальной странице.
    attribution: ТАСС, tass.ru
    content_storage_policy: link_title
    allowed_hosts: [tass.ru]
