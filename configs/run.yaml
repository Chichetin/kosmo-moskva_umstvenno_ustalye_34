# Параметры одного запуска (docs/contracts.md §5). Схема — floodvalue.contracts.schemas.RunConfig.
# До заморозки основного метода сквозной путь и интерфейс гоняются на чипе validation
# (D-010). После заморозки — демо-чип из test (D-010), chip_split -> test, дату в decision_*
# заменить датой S1 этого чипа (страж D-042); только замороженной конфигурацией, с записью в test-log.
chip_id: Sri-Lanka_713926
event_id: Sri-Lanka
chip_split: validation
portfolio_seed: 20260925          # seed размещения 10 объектов (только по валидности S1)
budget_rub: 5000                  # лимит на платные данные (C обязана уложиться); сценарный
# Момент решения оператора и срок, к которому данные должны быть доступны (D-001: 6–12 ч).
# Шаблон (D-042): procure берёт отсюда только сценарное время суток с поясом и окно
# deadline − decision_at; дату — дату S1 обрабатываемого чипа (observation_date в
# interim/source_manifest_s1.json, `make data`). Дата здесь обязана равняться дате S1 чипа
# chip_id выше (Sri-Lanka — 2017-05-30, docs/data.md §5), иначе procure падает.
# Время — конец суток S1 (UTC): в метаданных только дата съёмки, пролёт S1 ≈ 06/18 ч местного
# солнечного времени (Sri-Lanka ≈ 12:40 UTC, Spain ≈ 18:25 UTC) — решение не раньше съёмки.
decision_at: "2017-05-30T23:59:59+00:00"
decision_deadline: "2017-05-31T11:59:59+00:00"
# Прочие затраты решения C_other = C_compute + C_review × число купленных позиций
# (task.md: C_decision = C_data + C_compute + C_review + …); потребитель — procurement
# (strategy_comparison.csv other_cost_rub). Сценарные ставки команды, не измерены (D-023, D-038).
other_cost:
  compute_rub: 1000.00            # обработка S1 и выпуск карты — одинаково для A/B/C
  review_per_zone_rub: 500.00     # 0,5 ч аналитика × 1000 руб/ч на дешифрирование одной позиции
  status: scenario
  basis: "C_other = C_compute (1000 руб: обработка S1 и выпуск карты, одинаково для A/B/C) + C_review (500 руб × число купленных позиций: 0,5 ч аналитика × 1000 руб/ч); сценарные ставки команды; выезды (C_field) и ошибки действий (C_action_errors) не оцениваются — нет модели действия"
# Социальное ограничение стратегии C (task.md: отдельное явное ограничение, не множитель
# рублей EL): enabled=true — C сначала покрывает объекты этих классов. По умолчанию выключено;
# эффект — строка social_constraint_on (выключено) или social_constraint_off (включено) в procurement_sensitivity.csv (D-038).
social_constraint:
  enabled: false
  asset_classes: [clinic, school]
