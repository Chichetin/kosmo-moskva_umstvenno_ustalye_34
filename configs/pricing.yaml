# Базовый учебный сценарий цены по ПП РФ № 840 — task.md, «Как проверить стоимость по ПП РФ № 840».
# РП = Б × К × О × П × Т × Р. Коэффициенты — здесь, в коде только формула.
legal_edition: "ПП РФ № 840 от 29.06.2019 в ред. ПП РФ № 1297 от 27.08.2025"
# Правки ПП № 1297 действуют с 06.09.2025 (подтверждено источником ниже) — не часть
# строки legal_edition, т. к. её значение сверяется байт-в-байт с export/validate.py
# и tests/fixtures/good/procurement_plan.csv (менять запрещено этим PR).
legal_checked_at: "2026-09-25"  # самостоятельная проверка редакции (P20, критерий 18) — источники и разбор по пунктам: docs/pp840.md
# Источники (полный разбор, URL и метод проверки — docs/pp840.md §§1-2):
#   ПП № 840 от 29.06.2019 (консолидированный текст): https://base.garant.ru/72284094/
#   ПП № 1297 от 27.08.2025 (первоисточник, government.ru): http://government.ru/docs/all/160697/
#   Приказ ГК «Роскосмос» № 116 от 21.05.2026: https://www.garant.ru/products/ipo/prime/doc/414345303/
# publication.pravo.gov.ru и полнотекстовая КонсультантПлюс не открылись из среды проверки — не использованы как первоисточник (docs/pp840.md §1).
methodology_reference: "Приказ ГК «Роскосмос» № 116 от 21.05.2026 (рег. 26.06.2026 № 87243) — методика определения стоимости БРЕ, не ставка; реквизиты подтверждены первоисточником (docs/pp840.md §3)"
case_reference_date: "2026-09-20"
formula: "РП = Б × К × О × П × Т × Р"  # п. 2 Правил (в ред. ПП № 1297) — формула подтверждена первоисточником, docs/pp840.md §3

base_rate:
  rub_per_km2: 788.64
  status: scenario              # official — только с проверяемым источником конкретной ставки; п. 3 Правил делегирует ставку Б Роскосмосу, опубликованного числа в рублях не найдено (docs/pp840.md §3, §5)
  source: "Учебная сценарная ставка из материалов кейса (task.md); подтверждённый размер БРЕ не установлен"
  # Проверено 2026-09-25, источники и метод проверки — docs/pp840.md §§2-3, 5
  # (строка выше не менялась: сверяется байт-в-байт с tests/fixtures/good/candidate_orders.geojson).

processing_coef: {L0: 1.0, L1: 1.0, L2: 1.2}
usage_coef: {internal: 1.0, limited: 1.2, unrestricted: 1.5}
freshness:
  new_guaranteed: 1.8           # acquisition_type=new, guaranteed_purchase=true
  operational: 1.0              # имеющиеся данные, давность <= operational_max_age_days (граница включительно)
  archive: 0.6                  # старше operational_max_age_days
  operational_max_age_days: 90
  # acquisition_type=new без guaranteed_purchase=true — ошибка валидации (правило не задано постановкой)

discount:                       # Р = min(1; max(floor; slope × ln(S / r²) + intercept)); S — км², r — м
  optical: {slope: -0.058, intercept: 1.037, floor: 0.2}
  sar:     {slope: -0.020, intercept: 1.031, floor: 0.7}
  previous_area_km2: 0          # ранее учтённые заказы в календарном году (по умолчанию 0)
  group_by: [sensor_type, resolution_m, calendar_year]
  # Ключ группы — sensor_family (не сырой sensor_type) × resolution_m × calendar_year
  # даты расчёта as_of; discount_group_id = "<семейство>_<r>m_<год>" (D-017, п.2).
  # group_area_km2 = сумма area_km2 выбранных позиций группы в корзине стратегии + previous_area_km2
  sensor_family: {optical: [optical], sar: [sar]}   # значения sensor_type в каталоге

rounding:
  mode: ROUND_HALF_UP
  area_km2: "0.001"
  discount_coef: "0.000000001"
  unit_price_rub_km2: "0.01"
  cost_rub: "0.01"
# Порядок: unit_price_rub_km2 = round(Б × О × П × Т × Р, 0.01); cost_rub = round(unit_price_rub_km2 × area_km2, 0.01);
# Р округляется до 9 знаков до умножения; итог стратегии — сумма cost_rub строк.
min_area_km2: 1.0               # проверяется до округления
area_crs: "EPSG:6933"

# Контрольная арифметика постановки — тесты procurement обязаны её воспроизводить:
# Б=788,64; К=1,000; оптика 1 м; S=1,000; L2; internal; new guaranteed → 1703.46
# то же operational → 946.37; archive > 90 дней → 567.82
control_examples:
  - {processing_level: L2, usage_type: internal, freshness: new_guaranteed, area_km2: 1.0, resolution_m: 1, sensor: optical, cost_rub: 1703.46}
  - {processing_level: L2, usage_type: internal, freshness: operational,    area_km2: 1.0, resolution_m: 1, sensor: optical, cost_rub: 946.37}
  - {processing_level: L2, usage_type: internal, freshness: archive,        area_km2: 1.0, resolution_m: 1, sensor: optical, cost_rub: 567.82}
